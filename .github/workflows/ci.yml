name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (CPU) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        # The `dev` extra pins everything the CPU suite needs (pytest, matplotlib,
        # imageio, pillow); torch is installed above from the CPU wheel index.
        run: pip install -e ".[dev]"

      - name: Run CPU-testable suite
        run: pytest -m "not gpu and not local_data" -q
